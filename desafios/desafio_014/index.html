<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 014 tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }
        thead {
            background-color: gray;
            color: white;
        }
        tbody #cor {
            background-color: gray;
            color: white;
        }
        tfoot {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Desafio 014 tabelas</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope='col'>Áreas</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">notas</th>
                <th rowspan="2" scope="col">média</th>
            </tr>     
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
                     

        </thead>
        <tbody>
            
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>

            <tr>
               <td>Física</td>
               <td>0,0</td>
               <td>0,0</td>
               <td>0,0</td>
            </tr>

            <tr>
                <td>Química</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>

            <td>Biologia</td>
            <td>0,0</td>
            <td>0,0</td>
            <td>0,0</td>

            <tr id="cor">
                <th colspan="4" scope="row">Média de exatas</th>
                <td>0,0</td>
            </tr>

            <tr>
                <th rowspan="2" scope="row">Humanas</th>
                <td>História</td>
                <td>0,0</td>
                <td>0,0</td>
                <td>0,0</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <th colspan="4">Média de humanas</th>
                <td>0,0</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
